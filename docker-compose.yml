services:
  app:
    build:
      dockerfile: ./Dockerfile.dev
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    entrypoint: ./entrypoint.sh
    environment:
      MONGO_DB: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
    networks:
      - voluntrack-net
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); } catch (error) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]});
          }
          if (!db.hello().isWritablePrimary) { quit(1); }
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    ports:
      - "27017:27017"
    networks:
      - voluntrack-net

networks:
  voluntrack-net:
    driver: bridge
